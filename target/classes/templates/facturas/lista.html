<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Facturas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
    <h1>Facturas</h1>
    <div class="mb-3">
        <a class="btn btn-primary" href="/facturas/nueva">Nueva Venta</a>
        <a class="btn btn-secondary" href="/">Inicio</a>
    </div>
    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th><th>Número</th><th>Fecha</th><th>Cliente</th><th>Total</th><th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="f : ${facturas}">
                <td th:text="${f.id}">1</td>
                <td th:text="${f.numero}">F-1</td>
                <td th:text="${f.fecha}">2025-01-01</td>
                <td th:text="${f.cliente != null ? f.cliente.nombre : '-'}">Cliente</td>
                <td th:text="${#numbers.formatDecimal(f.total,1,'COMMA',2,'POINT')}">$0,00</td>
                <td class="text-end">
                    <a th:href="@{'/facturas/' + ${f.id}}" class="btn btn-sm btn-info">Ver</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
