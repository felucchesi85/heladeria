<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Estadísticas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Estadísticas</h1>
    <a class="btn btn-secondary" href="/">Inicio</a>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Producto más vendido</h5>
          <p class="mb-1"><strong th:text="${stats.productoMasVendido != null ? stats.productoMasVendido.nombre : '-'}">-</strong></p>
          <p class="text-muted">Cantidad: <span th:text="${stats.cantidadProductoMasVendido}">0</span></p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Cliente que más compra</h5>
          <p class="mb-1"><strong th:text="${stats.mejorCliente != null ? stats.mejorCliente.nombre : '-'}">-</strong></p>
          <p class="text-muted">Total: <span th:text="${#numbers.formatDecimal(stats.totalMejorCliente,1,'COMMA',2,'POINT')}">$0,00</span></p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Ventas</h5>
          <ul class="list-unstyled mb-0">
            <li>Hoy: <strong th:text="${#numbers.formatDecimal(stats.ventasDia,1,'COMMA',2,'POINT')}">$0,00</strong></li>
            <li>Semana: <strong th:text="${#numbers.formatDecimal(stats.ventasSemana,1,'COMMA',2,'POINT')}">$0,00</strong></li>
            <li>Mes: <strong th:text="${#numbers.formatDecimal(stats.ventasMes,1,'COMMA',2,'POINT')}">$0,00</strong></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <h3 class="mt-4">Productos con stock bajo</h3>
  <table class="table table-striped">
    <thead>
      <tr><th>#</th><th>Nombre</th><th>Stock</th></tr>
    </thead>
    <tbody>
      <tr th:each="p : ${stats.productosStockBajo}">
        <td th:text="${p.id}">1</td>
        <td th:text="${p.nombre}">Nombre</td>
        <td th:text="${p.stock}">0</td>
      </tr>
      <tr th:if="${#lists.isEmpty(stats.productosStockBajo)}">
        <td colspan="3" class="text-center text-muted">Sin alertas de stock</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
