<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Cuenta corriente de clientes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Incluí tus CSS/Bootstrap si corresponde -->
</head>
<body>
<div class="container my-3">
    <h1>Cuenta corriente</h1>

    <!-- Selector de cliente -->
    <div class="mb-3">
        <label for="selCliente" class="form-label">Cliente</label>
        <select id="selCliente" class="form-select">
            <option value="">-- Seleccione un cliente --</option>
            <option th:each="c : ${clientes}"
                    th:value="${c.id}"
                    th:selected="${cliente != null} ? ${c.id} == ${cliente.id} : false"
                    th:text="${c.nombre} + ' ' + (c.apellido != null ? c.apellido : '') + (c.email != null ? ' - ' + c.email : '')">
            </option>
        </select>
    </div>

    <!-- Detalle de la cuenta (solo si hay cliente seleccionado) -->
    <div th:if="${cliente != null}">
        <div class="card mb-3">
            <div class="card-body">
                <h5 th:text="${cliente.nombre} + ' ' + (cliente.apellido != null ? cliente.apellido : '')"></h5>
                <div class="text-muted">
                    <span th:text="${cliente.email}">email</span>
                    <span th:if="${cliente.telefono}"> · Tel: <span th:text="${cliente.telefono}"></span></span>
                </div>
                <div class="mt-2">
                    Saldo pendiente: <strong th:text="${#numbers.formatDecimal(saldo,1,2)}"></strong>
                </div>
            </div>
        </div>

        <!-- Formulario: agregar movimiento -->
        <div class="card mb-3">
            <div class="card-header">Agregar movimiento</div>
            <div class="card-body">
                <form th:action="@{'/facturas/clientes/' + ${cliente.id} + '/movimientos'}" method="post" class="row g-2">
                    <div class="col-sm-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" name="fecha" class="form-control" required />
                    </div>
                    <div class="col-sm-3">
                        <label class="form-label">Monto</label>
                        <input type="text" name="monto" class="form-control" placeholder="Monto (+ cargo / - pago)" />
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">Observación</label>
                        <input type="text" name="observacion" class="form-control" placeholder="Observación (opcional)" />
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Agregar movimiento</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Últimos movimientos -->
        <div class="card">
            <div class="card-header">Últimos movimientos</div>
            <div class="card-body p-0">
                <table class="table mb-0">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Monto</th>
                        <th>Observación</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(movimientos)}">
                        <td colspan="3" class="text-center text-muted">Sin movimientos</td>
                    </tr>
                    <tr th:each="m : ${movimientos}">
                        <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#numbers.formatDecimal(m.monto,1,2)}"></td>
                        <td th:text="${m.observacion}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        var sel = document.getElementById('selCliente');
        if (sel) {
            sel.addEventListener('change', function () {
                if (this.value) {
                    window.location.href = '/facturas/clientes/' + this.value + '/cuenta';
                }
            });
        }
    })();
</script>
</body>
</html>
