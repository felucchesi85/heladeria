<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Producto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
    <h1 th:text="${producto.id} != null ? 'Editar Producto' : 'Nuevo Producto'">Producto</h1>
    <form th:action="@{/productos}" th:object="${producto}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input class="form-control" th:field="*{nombre}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{categoria.id}" required>
                <option value="">-- Seleccione --</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>
        <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
        </div>
        <div class="col-md-4">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" th:field="*{stock}" required>
        </div>
        <div class="col-12">
            <a class="btn btn-secondary" href="/productos">Volver</a>
            <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
    </form>
</body>
</html>
