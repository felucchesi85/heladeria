# ============================================
# CONFIGURACIÓN APLICACIÓN HELADERÍA
# ============================================

# Información de la aplicación
spring.application.name=sistema-facturacion-heladeria
server.port=8080

# ============================================
# CONFIGURACIÓN BASE DE DATOS MYSQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/heladeria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=heladeria
spring.datasource.password=heladeria
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HeladeriaHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Inicialización de scripts SQL (data.sql / schema.sql)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.sql.init.data-locations=classpath:/data.sql

# ============================================
# CONFIGURACIÓN THYMELEAF
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================
# CONFIGURACIÓN DE DESARROLLO
# ============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ============================================
# CONFIGURACIÓN DE LOGS
# ============================================
logging.level.com.heladeria=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# LOG extra para ver creación/actualización de esquema (Hibernate 6)
logging.level.org.hibernate.tool.schema=DEBUG
# LOG del inicializador de scripts de Spring
logging.level.org.springframework.boot.sql.init=DEBUG
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG

# ============================================
# ACTUATOR / HEALTH
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================
# DEBUG DE ERRORES
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# CONFIGURACIÓN ESPECÍFICA HELADERÍA
# ============================================
heladeria.empresa.nombre=Heladería Artesanal
heladeria.empresa.direccion=Av. Principal 123, Ciudad
heladeria.empresa.telefono=+54 11 1234-5678
heladeria.empresa.email=contacto@heladeria.com
heladeria.facturacion.serie=A
heladeria.facturacion.numero-inicial=1

# Empresa (PDF)
heladeria.empresa.cuit=30-00000000-0
heladeria.empresa.logo=classpath:/static/logo.png

# Stock mínimo para alertas de estadísticas
heladeria.stock.minimo=5
