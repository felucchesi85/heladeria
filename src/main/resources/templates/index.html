<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Sistema Heladería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-ice-cream"></i> Heladería</a>
        </div>
    </nav>

    <section class="container py-5">
        <h1 class="mb-4">Accesos rápidos</h1>
        <div class="row g-4">
            <div class="col-md-3">
                <a class="btn btn-success btn-lg w-100" href="/facturas/nueva">
                    <i class="fas fa-plus me-2"></i>Nueva Venta
                </a>
            </div>
            <div class="col-md-3">
                <a class="btn btn-info btn-lg w-100" href="/productos">
                    <i class="fas fa-ice-cream me-2"></i>Gestión de Productos
                </a>
            </div>
            <div class="col-md-3">
                <a class="btn btn-warning btn-lg w-100" href="/clientes">
                    <i class="fas fa-users me-2"></i>Gestión de Clientes
                </a>
            </div>
            <div class="col-md-3">
                <a class="btn btn-secondary btn-lg w-100" href="/estadisticas">
                    <i class="fas fa-chart-line me-2"></i>Estadísticas
                </a>
            </div>
        </div>

        <hr class="my-5">

        <div class="alert alert-info">
            <strong>Consejo:</strong> genere una factura y luego pruebe descargar el PDF desde el detalle.
        </div>
    </section>

    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <small>&copy; 2025 Sistema Heladería</small>
        </div>
    </footer>
</body>
</html>
