<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
	<h1 class="mb-3">Ventas</h1>
	<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
	<div class="mb-3">
		<a class="btn btn-primary" href="/facturas/nueva" th:href="@{/facturas/nueva}">Nueva venta</a>
	</div>

	<div class="mb-3">
		<form class="row g-2" th:action="@{/facturas}" method="get">
			<div class="col-md-3">
				<input class="form-control" name="numero" placeholder="Número" th:value="${numero}">
			</div>
			<div class="col-md-3">
				<select class="form-select" name="clienteId">
					<option value="">-- Cliente --</option>
					<option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"
							th:selected="${clienteId} == ${c.id}"></option>
				</select>
			</div>
			<div class="col-md-2">
				<input type="date" class="form-control" name="desde" th:value="${desde}">
			</div>
			<div class="col-md-2">
				<input type="date" class="form-control" name="hasta" th:value="${hasta}">
			</div>
			<div class="col-md-2 d-grid">
				<button class="btn btn-outline-primary" type="submit">Buscar</button>
			</div>
		</form>
	</div>

	<table class="table table-striped align-middle">
		<thead>
			<tr>
				<th>#</th>
				<th>Fecha</th>
				<th>Cliente</th>
				<th>Ítems</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="f : ${facturas}">
				<td th:text="${f.numero != null ? f.numero : f.id}">-</td>
				<td th:text="${#temporals.format(f.fecha, 'dd/MM/yyyy')}">-</td>
				<td th:text="${f.cliente != null ? f.cliente.nombre : '-'}">-</td>
				<td th:text="${f.detalles != null ? f.detalles.size() : 0}">0</td>
				<td>
					<a class="btn btn-sm btn-outline-secondary" th:href="@{|/facturas/${f.id}|}">Ver</a>
				</td>
			</tr>
			<tr th:if="${#lists.isEmpty(facturas)}">
				<td colspan="5" class="text-center text-muted">Sin ventas registradas</td>
			</tr>
		</tbody>
	</table>

	<!-- Paginación: preservar filtros -->
	<nav th:if="${page != null and page.totalPages > 1}" aria-label="Paginación">
		<ul class="pagination">
			<li class="page-item" th:classappend="${page.first} ? 'disabled'">
				<a class="page-link"
				   th:href="@{/facturas(page=${page.number-1},size=${page.size},numero=${numero},clienteId=${clienteId},desde=${desde},hasta=${hasta})}">Anterior</a>
			</li>
			<li class="page-item disabled">
				<a class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</a>
			</li>
			<li class="page-item" th:classappend="${page.last} ? 'disabled'">
				<a class="page-link"
				   th:href="@{/facturas(page=${page.number+1},size=${page.size},numero=${numero},clienteId=${clienteId},desde=${desde},hasta=${hasta})}">Siguiente</a>
			</li>
		</ul>
	</nav>
</body>
</html>
