<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Detalle de Factura</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" th:object="${factura}">
	<a class="btn btn-link mb-3" th:href="@{/facturas}">← Volver a ventas</a>

	<h2>Factura <span th:text="*{numero != null ? numero : id}">-</span></h2>
	<div class="row mb-3">
		<div class="col-md-4"><strong>Fecha:</strong> <span th:text="${#temporals.format(factura.fecha, 'dd/MM/yyyy')}">-</span></div>
		<div class="col-md-8"><strong>Cliente:</strong> <span th:text="${factura.cliente != null ? factura.cliente.nombre : '-'}">-</span></div>
	</div>

	<h5>Ítems</h5>
	<table class="table table-sm align-middle">
		<thead>
			<tr>
				<th>Producto</th>
				<th class="text-end">Cantidad</th>
				<th class="text-end">Precio</th>
				<th class="text-end">Subtotal</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="d : *{detalles}">
				<td th:text="${d.producto != null ? d.producto.nombre : '-'}">-</td>
				<td class="text-end" th:text="${d.cantidad}">0</td>
				<td class="text-end" th:text="${#numbers.formatDecimal(d.precioUnitario,1,'COMMA',2,'POINT')}">0,00</td>
				<td class="text-end" th:text="${#numbers.formatDecimal(d.subtotal,1,'COMMA',2,'POINT')}">0,00</td>
			</tr>
			<tr th:if="${#lists.isEmpty(factura.detalles)}">
				<td colspan="4" class="text-center text-muted">Sin ítems</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
