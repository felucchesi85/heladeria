<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Nueva Factura</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1>Nueva Venta</h1>
    <div class="mb-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/facturas}">Ver ventas</a>
    </div>
    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/facturas}" th:object="${factura}" method="post">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Número</label>
                <input class="form-control" th:field="*{numero}" placeholder="Auto si se deja vacío">
            </div>
            <div class="col-md-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" th:field="*{fecha}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Cliente</label>
                <select class="form-select" th:field="*{cliente.id}" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
            </div>
        </div>

        <h4 class="mt-4">Detalles</h4>
        <table class="table align-middle">
            <thead>
                <tr>
                    <th style="width: 40%">Producto</th>
                    <th style="width: 15%">Cantidad</th>
                    <th style="width: 20%">Precio</th>
                    <th style="width: 20%">Subtotal</th>
                    <th style="width: 5%"></th>
                </tr>
            </thead>
            <tbody id="detalle-rows">
                <tr th:each="d,iter : *{detalles}">
                    <td>
                        <select class="form-select" th:field="*{detalles[__${iter.index}__].producto.id}" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="p : ${productos}"
                                    th:value="${p.id}"
                                    th:text="${p.nombre}"
                                    th:attr="data-precio=${p.precio}"></option>
                        </select>
                    </td>
                    <td><input type="number" min="1" class="form-control" th:field="*{detalles[__${iter.index}__].cantidad}" required></td>
                    <td><input type="number" step="0.01" class="form-control" th:field="*{detalles[__${iter.index}__].precioUnitario}" required></td>
                    <td>
                        <input type="number" step="0.01" class="form-control" th:value="${d.subtotal}" readonly>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" type="button" onclick="removeRow(this)">x</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <button class="btn btn-outline-primary" type="button" onclick="addRow()">Agregar ítem</button>

        <div class="mt-4">
            <a class="btn btn-secondary" href="/facturas">Volver</a>
            <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
    </form>

    <template id="row-template">
        <tr>
            <td>
                <select class="form-select" name="detalles[idx].producto.id" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="p : ${productos}"
                            th:value="${p.id}"
                            th:text="${p.nombre}"
                            th:attr="data-precio=${p.precio}"></option>
                </select>
            </td>
            <td><input type="number" min="1" class="form-control" name="detalles[idx].cantidad" required></td>
            <td><input type="number" step="0.01" class="form-control" name="detalles[idx].precioUnitario" required></td>
            <td><input type="number" step="0.01" class="form-control" name="detalles[idx].subtotal" readonly></td>
            <td><button class="btn btn-sm btn-outline-danger" type="button" onclick="removeRow(this)">x</button></td>
        </tr>
    </template>

    <script th:inline="javascript">
        function toNumber(v) {
            const n = parseFloat(v);
            return isNaN(n) ? 0 : n;
        }
        function getSelectedPrecio(selectEl) {
            const opt = selectEl && selectEl.selectedOptions && selectEl.selectedOptions[0];
            return opt && opt.dataset ? toNumber(opt.dataset.precio) : 0;
        }
        function recalcRow(tr, forceFromProduct = false) {
            const sel = tr.querySelector('select[name^="detalles["]');
            const qty = tr.querySelector('input[name$=".cantidad"]');
            const precio = tr.querySelector('input[name$=".precioUnitario"]');
            const subtotal = tr.querySelector('input[name$=".subtotal"], input[readonly]');
            if (!sel || !qty || !precio || !subtotal) return;

            const precioProducto = getSelectedPrecio(sel);
            if (forceFromProduct && precioProducto > 0) {
                // Si cambió el producto, tomar siempre el precio del producto
                precio.value = precioProducto.toFixed(2);
            } else if (!precio.value || toNumber(precio.value) === 0) {
                // Autocompletar si estaba vacío/cero
                if (precioProducto > 0) precio.value = precioProducto.toFixed(2);
            }

            const st = toNumber(qty.value) * toNumber(precio.value);
            subtotal.value = st > 0 ? st.toFixed(2) : '';
        }
        function initRow(tr) {
            const sel = tr.querySelector('select[name^="detalles["]');
            const qty = tr.querySelector('input[name$=".cantidad"]');
            const precio = tr.querySelector('input[name$=".precioUnitario"]');
            if (sel) sel.addEventListener('change', () => recalcRow(tr, true));
            if (qty) {
                qty.addEventListener('input', () => recalcRow(tr));
                qty.addEventListener('change', () => recalcRow(tr));
            }
            if (precio) {
                precio.addEventListener('input', () => recalcRow(tr));
                precio.addEventListener('change', () => recalcRow(tr));
            }
            recalcRow(tr);
        }
        function reindexRows() {
            const tbody = document.getElementById('detalle-rows');
            Array.from(tbody.querySelectorAll('tr')).forEach((tr, idx) => {
                tr.querySelectorAll('[name]').forEach(el => {
                    el.name = el.name.replace(/detalles\[\d+\]/, `detalles[${idx}]`);
                });
            });
        }
        function addRow() {
            const tbody = document.getElementById('detalle-rows');
            const tpl = document.getElementById('row-template').content.cloneNode(true);
            const idx = tbody.children.length;
            tpl.querySelectorAll('[name]').forEach(el => {
                el.name = el.name.replace('idx', idx);
            });
            const tr = tpl.querySelector('tr');
            tbody.appendChild(tr);
            initRow(tr);
        }
        function removeRow(btn) {
            const tr = btn.closest('tr');
            tr.parentElement.removeChild(tr);
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('#detalle-rows tr').forEach(initRow);
            const form = document.querySelector('form');
            form.addEventListener('submit', reindexRows);
        });
    </script>

    <hr class="my-4">
    <h4>Últimas ventas</h4>
    <table class="table table-sm">
        <thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th class="text-end">Total</th><th></th></tr></thead>
        <tbody>
        <tr th:each="f : ${ultimas}">
            <td th:text="${f.numero != null ? f.numero : f.id}">-</td>
            <td th:text="${#temporals.format(f.fecha, 'dd/MM/yyyy')}">-</td>
            <td th:text="${f.cliente != null ? f.cliente.nombre : '-'}">-</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(f.total,1,'COMMA',2,'POINT')}">0,00</td>
            <td><a class="btn btn-sm btn-outline-secondary" th:href="@{|/facturas/${f.id}|}">Ver</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(ultimas)}"><td colspan="5" class="text-center text-muted">Sin ventas</td></tr>
        </tbody>
    </table>
    <a class="btn btn-link" th:href="@{/facturas}">Ver todas</a>
</body>
</html>
