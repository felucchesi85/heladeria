<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Clientes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
    <h1>Clientes</h1>
    <div class="mb-3">
        <a class="btn btn-primary" href="/clientes/nuevo">Nuevo</a>
        <a class="btn btn-secondary" href="/">Inicio</a>
    </div>
    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Saldo</th><th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.nombre}">Juan</td>
                <td th:text="${c.direccion}">Calle</td>
                <td th:text="${c.telefono}">000</td>
                <td th:text="${#numbers.formatDecimal(c.saldoPendiente,1,'COMMA',2,'POINT')}">$0,00</td>
                <td class="text-end">
                    <a th:href="@{'/clientes/editar/' + ${c.id}}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{'/clientes/eliminar/' + ${c.id}}" method="post" style="display:inline">
                        <button class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
