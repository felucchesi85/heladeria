<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cliente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
    <h1 th:text="${cliente.id} != null ? 'Editar Cliente' : 'Nuevo Cliente'">Cliente</h1>
    <form th:action="@{/clientes}" th:object="${cliente}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}">
        <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input class="form-control" th:field="*{nombre}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Apellido</label>
            <input class="form-control" th:field="*{apellido}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input class="form-control" th:field="*{telefono}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>

        <div class="col-12">
            <label class="form-label">Dirección</label>
            <input class="form-control" th:field="*{direccion}">
        </div>
        <div class="col-md-4">
            <label class="form-label">Saldo Pendiente</label>
            <input type="number" step="0.01" class="form-control" th:field="*{saldoPendiente}" required>
        </div>
        <div class="col-12">
            <a class="btn btn-secondary" href="/clientes">Volver</a>
            <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
    </form>
</body>
</html>
