<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Productos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container py-4">
    <h1>Productos</h1>
    <div class="mb-3">
        <a class="btn btn-primary" href="/productos/nuevo">Nuevo</a>
        <a class="btn btn-secondary" href="/">Inicio</a>
    </div>
    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>#</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">Chocolate</td>
                <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}">Cremas</td>
                <td th:text="${#numbers.formatDecimal(p.precio,1,'COMMA',2,'POINT')}">$0,00</td>
                <td th:text="${p.stock}">0</td>
                <td class="text-end">
                    <a th:href="@{'/productos/editar/' + ${p.id}}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{'/productos/eliminar/' + ${p.id}}" method="post" style="display:inline">
                        <button class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
